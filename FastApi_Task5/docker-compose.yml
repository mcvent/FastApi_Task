services:

  postgres:
    image: postgres:17-alpine3.21
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - .env
    user: ${POSTGRES_USER}

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app_network
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/DockerFile
    container_name: fastapi-blog-app
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      # Монтируем код для разработки (горячая перезагрузка)
      - ./fastapi_app:/app/fastapi_app
      # Монтируем .env
      - ./.env:/app/.env
#      - ./db.sqlite3:/app/db.sqlite3
      - ./fastapi_app/static/images:/app/static/images
      - ./alembic/versions:/app/alembic/versions
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/fastapi_app
    restart: unless-stopped
    command: uvicorn fastapi_app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - app_network
    depends_on:
      - postgres

volumes:
  db_data:

networks:
  app_network:
    driver: bridge